openapi: 3.1.1
info : 
  title: BLOG-API
  version: 1.0.0
  description: API REST para gestionar autores y posts de un blog
  contact:
    name: DevSpark startup
    email: DevSpark@contact.com


servers:
  - url: http://localhost:8080
    description: Desarrollo local
 
paths:
  /authors:
    get:
      summary: Obtener todos los autores
      description: Devuelve la lista completa de autores
      tags:
        - Autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

        '500':
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
     
    post:
      summary: Crear un nuevo Autor
      description: Crea un nuevo autor
      tags:
        - Autores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: obeject
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  description: Nombre completo del autor
                email:
                  type: string
                  format: email
                  description: Email del autor (debe ser unico)
                bio:
                  type: string
                  description: Biografia del autor (opcional)
      responses:
          '201':
            description: Autor creado exitosamente
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Author'


  /authors/{id}:
    get:
      summary: Obtener un autor por ID
      description: Obtiene un autor especifico
      tags:
      - Autores
      parameters:
       - name: id
         in: path
         required: true
         description: ID del autor
         schema:
          type: integer
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'



components:
  schemas:
    Author:
      type: obeject
      properties:
        id:
          type: integer
          description: ID unico del autor
        name:
          type: string
          description: Nombre completo del autor
        email:
          type: string
          format: email
          description: Email del autor
        bio:
          type: string
          description: Biografia del autor
        create_at:
          type: string
          format: date-time
          description: Fecha de creacion
    
    Error:
      type: obeject
      properties:
        error:
          type: string
          description: Mensaje de error
